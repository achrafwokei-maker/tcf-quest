[project]
name = "tcfquest-server"
version = "0.1.0"
description = "Local backend for TCF Quest: progress storage, learning engine and local AI bridge"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
]

[project.optional-dependencies]
# Online beta only: Turso-compatible database driver (MIT).
beta = [
    "libsql>=0.1.11",
    "pyjwt[crypto]>=2.10",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tcfquest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
